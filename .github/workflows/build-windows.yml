# Build the Windows (NSIS x64) installer in the cloud.
#
# Purpose: prove `npm run dist:win` actually builds on real Windows — the one
# thing that can't be verified on Daniel's Mac — and hand back a downloadable
# .exe so the installer can be smoke-tested before a dedicated Windows laptop
# exists. This is the Section-7 de-risk; it does NOT replace on-hardware QA
# (SmartScreen behavior, real audio-device labels, actual tape-dump decode).
#
# Mirrors `npm run dist:win` (setup-vendor → electron-builder --win --x64) with
# an explicit `--publish never` guard so a CI build can never push a release.
# Unit tests are NOT re-run here — the dedicated Test workflow covers them on
# ubuntu, they're platform-agnostic, and `node --test test/*.test.js` relies on
# shell glob expansion that cmd.exe doesn't do.
#
# jx3p source: setup-vendor needs the danielspils/JP-Patches FORK (carries
# AUTO_BOOST_TARGET=0.92). It's a separate public repo, so we check it out and
# point JX3P_SRC at it. Branch is `master` (the fork's default).
#
# Triggers on windows-port now and on main after the port merges, so it keeps
# working once the branch collapses — no edit needed at merge time.

name: Build Windows installer

on:
  push:
    branches: [windows-port, main]
  pull_request:
    branches: [windows-port, main]
  # Runnable on demand from the Actions tab.
  workflow_dispatch:

# Read-only — this job builds an artifact, it never publishes a release.
permissions:
  contents: read

jobs:
  build:
    name: NSIS x64 installer
    runs-on: windows-latest
    # 45 (was 30): Azure signing adds per-binary round-trips — the app exe,
    # elevate helper, uninstaller, installer, and the vendored uv binaries.
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout jx3p fork (danielspils/JP-Patches)
        uses: actions/checkout@v4
        with:
          repository: danielspils/JP-Patches
          ref: master
          path: jx3p-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'        # current LTS, matches the Test workflow
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Populate vendor/ (uv.exe + jx3p fork)
        env:
          # Point setup-vendor at the fork we just checked out instead of the
          # default ~/JP-Patches (which doesn't exist on the runner).
          JX3P_SRC: ${{ github.workspace }}/jx3p-src
        run: npm run setup-vendor

      - name: Pre-install TrustedSigning module (Windows PowerShell 5.1)
        # electron-builder installs this on demand the first time it signs —
        # but its Install-Module call (in Windows PowerShell 5.1) hangs
        # forever in CI on the NuGet-provider confirmation prompt (run
        # 31864994891: 29 silent minutes into the 30-min timeout). Install it
        # up front, in 5.1 — Install-PackageProvider NuGet is a 5.1-ism and
        # fails outright in pwsh 7 (run 31887238438), and 5.1 is the shell
        # the signing step actually uses. TLS12 is required for PSGallery
        # from 5.1.
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber

      - name: Pre-install TrustedSigning module (pwsh)
        # Belt and braces: if electron-builder resolves pwsh instead of 5.1,
        # the module must be visible on pwsh's separate module path too. No
        # NuGet-provider dance here — pwsh's PowerShellGet doesn't need it.
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber

      - name: Build NSIS installer (Azure-signed)
        # Mirrors `electron-builder --win --x64` from the dist:win script, with
        # an explicit no-publish guard. No GH_TOKEN is exposed, so it couldn't
        # publish anyway — belt and suspenders.
        #
        # Signing: win.azureSignOptions in package.json (Azure Artifact
        # Signing — the cert is shared with Daniel's other project, so both
        # apps build SmartScreen reputation for ONE certificate). The Azure
        # signing client is Windows-only, which is fine: this job IS the
        # Windows build. Credentials reach DefaultAzureCredential via the
        # three env vars below (repo secrets). If they're ever absent (e.g. a
        # fork PR, which doesn't receive secrets), the signing step fails the
        # build — loudly, not silently unsigned.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-patches-windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
