name: Download report

# Daily check for NEW downloads, emailed only when there's something to say.
# GitHub exposes only a cumulative per-asset counter, so this job stores the
# last reported totals in .github/download-stats.json and reports the delta.
# The same snapshot also carries the relay Worker's download-button counters,
# which is what lets the email split each number into "via jx-3p.com" and
# "via GitHub" and attribute downloads to a country.
#
# All the logic is in scripts/download-report.mjs (pure half:
# scripts/download-report-lib.mjs, unit-tested in
# test/download-report-lib.test.js). Preview it any time with:
#
#     node scripts/download-report.mjs --dry-run
#
# Behaviour:
#   - runs daily; if nothing new since the last report, it exits silently
#     (no email, no commit)
#   - when there ARE new downloads, it emails the delta, then commits the new
#     snapshot — so the delta always means "since your last report"
#   - the email is sent BEFORE the snapshot is committed, so a failed send
#     leaves the snapshot untouched and tomorrow's run retries it
#
# One-time setup (already done): repo secrets MAIL_USERNAME / MAIL_PASSWORD
# (a Gmail App Password) under Settings → Secrets and variables → Actions.

on:
  schedule:
    # 07:12 UTC = 00:12 PDT (23:12 PST in winter) — just after midnight in
    # Daniel's Pacific timezone, so each report cleanly covers the prior
    # PACIFIC day and lands in his early morning. Two caveats baked in:
    #   - GitHub's scheduler runs crons LATE by an unpredictable amount (often
    #     15 min, lately ~3 h), so actual arrival drifts into 00:15–03:00-ish
    #     PDT. Can't be pinned to a precise minute — offsetting for the delay
    #     would misfire on the days GitHub is prompt (it'd send before the
    #     Pacific day even ended). Scheduling AFTER local midnight is the safe
    #     floor: the report never covers an unfinished day.
    #   - fixed UTC, so it shifts an hour across DST (00:12 PDT / 23:12 PST) —
    #     both near enough to midnight to not matter.
    # The :12 offset also dodges the top-of-hour congestion that delays crons.
    - cron: '12 7 * * *'
    # Same-day retry (15:12 UTC = 08:12 PDT): GitHub's cron drift has grown
    # from ~3 h to fired-11-hours-late / not-at-all (2026-08-27/28). Safe to
    # double-run: the delta logic means whichever run fires first sends and
    # advances the snapshot, and the other computes zero and stays silent.
    - cron: '12 15 * * *'
  workflow_dispatch: {}         # allow manual runs (Actions tab → Run workflow)

permissions:
  contents: write              # to commit the snapshot

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the report
        id: calc
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-report.mjs

      - name: Email the report
        if: steps.calc.outputs.send == 'true'
        # Pinned to a full commit SHA, not the mutable v3 tag: this step
        # receives MAIL_USERNAME/MAIL_PASSWORD (a Gmail App Password that
        # bypasses 2FA on the mailbox that is the recovery address for the
        # Apple/Azure/GitHub/Cloudflare accounts), and whoever controls a
        # mutable tag can run arbitrary code daily with those in env.
        # SHA below = v3.11.0 (what v3 pointed to on 2026-08-18). Updates
        # are deliberate: resolve the new tag's SHA and change both lines.
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7  # v3.11.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: JP Patches <${{ secrets.MAIL_USERNAME }}>
          to: danielspils@gmail.com
          subject: "JP Patches — new downloads today!"
          # Setting both body and html_body sends multipart/alternative:
          # text/plain for clients that want it, a monospace <pre> for the rest.
          body: ${{ steps.calc.outputs.body }}
          html_body: ${{ steps.calc.outputs.html }}

      # Refresh the private metrics page's data (docs/metrics/data.json) every
      # run — the page promises "updates daily", and country clicks / pings can
      # move on days with no downloads (no email).
      - name: Build metrics data
        run: node scripts/build-metrics-data.mjs

      # Snapshot + history are committed only after a successful send (or to
      # seed the first baseline), so a failed email doesn't burn the delta.
      # data.json is committed EVERY day. [skip ci] skips the Windows build;
      # the legacy Pages build ignores it (verified) and redeploys the site,
      # which is how the metrics page refreshes.
      - name: Commit snapshot + metrics data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.calc.outputs.commit }}" = "true" ]; then
            git add .github/download-stats.json .github/download-history.jsonl
          else
            # Non-report day: the report script still overwrote the snapshot
            # locally — restore it so the un-emailed delta isn't burned.
            git checkout -- .github/download-stats.json
          fi
          git add docs/metrics/data.json
          git commit -m "chore: download snapshot [skip ci]" || { echo "no change"; exit 0; }
          git push
