# Jekyll config for jx-3p.com (GitHub Pages source: /docs).
#
# Deliberately NO `theme:` key — this lets our custom _layouts/default.html
# take over without a default theme's CSS leaking in. The result: total
# visual control via assets/css/style.css, brand-aligned with the JP
# Patches app design system (see docs/design-system.md).

# `title` is the brand; `tagline` is appended for the search-result <title>
# so Google shows the terms JX-3P owners actually search (patch editor,
# librarian, Mac) — see _layouts/default.html <title>.
title: JP Patches
tagline: Roland JX-3P Librarian, Sequencer, and Editor for Mac
description: Free Mac app for the Roland JX-3P synthesizer — save, edit, organize, and share JX-3P patches and sequences. A modern patch editor and librarian that talks to the JX-3P over tape dump.
url: "https://jx-3p.com"

# GitHub Pages natively supports jekyll-sitemap — generates /sitemap.xml so
# Google can discover and crawl the site. Submit it in Search Console.
# jekyll-feed (also Pages-native) generates an Atom feed of the Notes posts at
# /feed.xml — the plumbing for RSS readers AND Buttondown's post-to-email
# automation (it watches the feed and mails subscribers on each new post).
# INTERNAL DOCS ARE NOT THE SITE. docs/ is both the Jekyll source and where
# this project keeps its own reference material, and 36 of the .md files here
# carry no front matter — so Jekyll copied them verbatim and they were live.
# jx-3p.com/SIGNING.md returned 200, publishing the signing setup including
# Azure account identifiers (2026-08-18).
#
# Anything listed here is for whoever is building the app, not for someone who
# owns a JX-3P. Adding a new internal doc means adding it here — there is no
# pattern that catches them, because a public page and an internal note are the
# same shape on disk.
exclude:
  - SIGNING.md
  - RELEASE.md
  - smoke-test.md
  - site-architecture.md
  - future-features.md
  - design-system.md
  - library-and-midi-spec.md
  - auto-calibration-handoff.md
  - session-handoff-2026-05-26.md
  - session-handoff-2026-06-10.md

plugins:
  - jekyll-sitemap
  - jekyll-feed

# Front-matter defaults.
# Blog posts (docs/_posts/*.md → the Notes section) automatically get the
# `post` layout and a clean /notes/<title>/ URL, so each note file only needs
# `title:` + `date:` of its own. Other .md files in docs/ (release notes,
# smoke test, etc.) still render bare without a layout — they're internal
# docs, not landing-page consumers.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /notes/:title/
